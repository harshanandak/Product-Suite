pre-commit:
  jobs:
    - name: source-test coupling
      run: bun run check:source-test

pre-push:
  jobs:
    - name: branch protection
      run: node scripts/branch-protection.js
      use_stdin: true
    - name: aggregate lint
      run: bun run lint
    - name: pre-push validation
      run: node scripts/prepush-gate.mjs
