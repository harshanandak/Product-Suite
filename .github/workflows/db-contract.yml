name: DB Contract

# Real-DB contract tier (atomic-accept wave, Lane B). Runs the platform-api
# `test/db-contract` suite against an EPHEMERAL Neon branch created per run, so the
# accept/create path is exercised over the real neon-http driver + real migrations.
# Isolated from the Platform Web CI job on purpose.
#
# Requires the `NEON_API_KEY` and `NEON_PROJECT_ID` secrets. `NEON_PROJECT_ID`
# is the production/source project; the harness must create a distinct disposable
# project for the empty-root proof. Missing credentials fail this required
# lane closed; a green skipped job is not conformance evidence.

# The tier costs ~17 min (serial ephemeral Neon branches), so both triggers carry the
# same paths filter and DB-irrelevant PRs skip it entirely. Safe because `db-contract`
# is NOT a required status check on `main` — a skipped run reports no conclusion, which
# would leave PRs unmergeable if it ever became required. Keep the two lists identical
# (enforced by test/repo-tooling.test.js) and err toward running.
on:
  push:
    branches:
      - main
    paths:
      - "apps/platform-api/**"
      - "packages/db/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/db-contract.yml"
  pull_request:
    paths:
      - "apps/platform-api/**"
      - "packages/db/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/db-contract.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-contract:
    name: db-contract
    runs-on: ubuntu-latest
    # Neon secrets are scoped to ONLY the steps that need them (below), NOT the
    # job level — otherwise `bun install`'s lifecycle scripts (e.g. `prepare`)
    # would run with NEON_API_KEY in the environment, letting a compromised
    # dependency exfiltrate it.
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Require Neon credential availability
        shell: bash
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::Neon conformance credentials are required; refusing a silently skipped real-DB lane."
            exit 1
          fi
          echo "Neon credentials present — db-contract suite will run against isolated test resources."

      - name: Run db-contract suite (ephemeral Neon branch per test)
        working-directory: apps/platform-api
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          DB_CONTRACT_REQUIRED: "1"
        run: bunx vitest run --config vitest.db-contract.config.ts
