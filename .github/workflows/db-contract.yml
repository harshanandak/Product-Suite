name: DB Contract

# Real-DB contract tier (atomic-accept wave, Lane B). Runs the platform-api
# `test/db-contract` suite against an EPHEMERAL Neon branch created per run, so the
# accept/create path is exercised over the real neon-http driver + real migrations.
# Isolated from the Platform Web CI job on purpose.
#
# Requires the `NEON_API_KEY` and `NEON_PROJECT_ID` secrets. `NEON_PROJECT_ID`
# is the production/source project; the harness must create a distinct disposable
# project for the empty-root proof. Missing credentials fail this required
# lane closed; a green skipped job is not conformance evidence.

# Every pull request reports this check. DB-irrelevant changes finish explicitly as N/A;
# authority-relevant changes require the real-Neon lane and fail closed without credentials.
on:
  push:
    branches:
      - main
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  db-contract:
    name: db-contract
    runs-on: ubuntu-latest
    # Neon secrets are scoped to ONLY the steps that need them (below), NOT the
    # job level — otherwise `bun install`'s lifecycle scripts (e.g. `prepare`)
    # would run with NEON_API_KEY in the environment, letting a compromised
    # dependency exfiltrate it.
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact checkout
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual_head="$(git rev-parse HEAD)"
          test "$actual_head" = "$EXPECTED_HEAD"
          echo "DB_CONTRACT_EXACT_HEAD=$actual_head" >> "$GITHUB_ENV"

      - name: Determine DB-contract relevance
        id: relevance
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="origin/${BASE_REF}...HEAD"
          elif git rev-parse --verify --quiet "${EVENT_BEFORE}^{commit}" >/dev/null; then
            range="${EVENT_BEFORE}..HEAD"
          else
            range="HEAD^..HEAD"
          fi
          if git diff --name-only "$range" | grep -Eq '^(apps/platform-api/|packages/db/|package\.json$|bun\.lock$|\.github/workflows/db-contract\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report DB-contract N/A
        if: "${{ steps.relevance.outputs.run != 'true' }}"
        run: 'echo "DB contract N/A: no authority-relevant files changed."'

      - name: Setup Bun
        if: "${{ steps.relevance.outputs.run == 'true' }}"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install dependencies
        if: "${{ steps.relevance.outputs.run == 'true' }}"
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run focused real-Neon conformance proof
        id: conformance
        if: "${{ steps.relevance.outputs.run == 'true' }}"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          DB_CONTRACT_CONFORMANCE_MARKER_PATH: ${{ runner.temp }}/db-contract-conformance.marker
        run: bun run --cwd apps/platform-api test:db-contract:conformance

      - name: Run required DB-contract suite
        id: suite
        # GitHub's success() gate makes a failed focused proof stop before the
        # expensive 57-test database suite starts.
        if: "${{ steps.relevance.outputs.run == 'true' && success() }}"
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          DB_CONTRACT_BRANCH_CAP: ${{ vars.DB_CONTRACT_BRANCH_CAP }}
          DB_CONTRACT_REQUIRED: "1"
          DB_CONTRACT_CONFORMANCE_MARKER_PATH: ${{ runner.temp }}/db-contract-conformance.marker
          DB_CONTRACT_TELEMETRY_PATH: ${{ github.workspace }}/apps/platform-api/db-contract-telemetry.json
          VITEST_SKIP_INSTALL_CHECKS: "1"
        run: bun run --cwd apps/platform-api test:db-contract:required

      - name: Publish DB-contract summary
        if: "${{ always() && steps.relevance.outputs.run == 'true' && steps.conformance.outcome == 'success' }}"
        env:
          DB_CONTRACT_TELEMETRY_PATH: ${{ github.workspace }}/apps/platform-api/db-contract-telemetry.json
        run: bun run --cwd apps/platform-api test:db-contract:summary

      - name: Upload DB-contract telemetry
        if: "${{ always() && steps.relevance.outputs.run == 'true' && steps.conformance.outcome == 'success' }}"
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: db-contract-telemetry-${{ env.DB_CONTRACT_EXACT_HEAD }}
          path: apps/platform-api/db-contract-telemetry.json
          if-no-files-found: error
