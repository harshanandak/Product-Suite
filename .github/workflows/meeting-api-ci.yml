name: Meeting API CI

on:
  push:
    branches:
      - main
    paths:
      - "apps/meeting-api/*.py"
      - "apps/meeting-api/backend/**"
      - "apps/meeting-api/tests/**"
      - "packages/contracts/**"
      - "packages/sdk/**"
      - "test/**"
      - "scripts/meeting-api-validation.mjs"
      - ".github/workflows/meeting-api-ci.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: meeting_agent
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meeting_agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      PYTHONPATH: apps/meeting-api
      DEPLOYMENT_MODE: oss
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meeting_agent
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meeting_agent
      DATABASE_ENVIRONMENT: fresh
      MEETING_TARGET_SMOKE_REQUIRED: "1"
      MEETING_TARGET_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/meeting_agent
      MEETING_TARGET_SMOKE_DATABASE_PROVIDER: postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install JavaScript dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r apps/meeting-api/backend/requirements.txt

      - name: Run backend lint
        run: python -m flake8 --select=E9,F63,F7,F82 apps/meeting-api/backend apps/meeting-api/tests/backend

      - name: Provision canonical runtime roles
        run: bun run provision:database-roles

      - name: Run backend migrations (canonical Drizzle runner)
        run: >-
          bun run migrate:database -- bootstrap --environment fresh
          --history-variant repaired-bootstrap
          --expected-pending
          0000_stale_jamie_braddock,0001_dear_the_enforcers,0002_polite_orphan,0003_tranquil_tattoo,0004_minor_lockheed,0005_rename_tasks_to_checks,0006_provenance_foundation,0007_proposals,0008_agent_transcript,0009_chat_threads,0010_memory_brain,0011_memory_source_proposal_uniq,0012_proposals_reflected_at,0013_knowledge_base,0014_work_item_applied_from_proposal_partial,0015_meeting_promotions,0016_memory_ownership_axis,0017_proposal_target_snapshot,0018_collaboration_fabric,0019_neon_authority_reconciliation

      - name: Verify canonical history without writes
        run: bun run migrate:database -- verify --environment fresh --history-variant repaired-bootstrap --expected-floor 0019

      - name: Assert transient target smoke is wired and required
        shell: bash
        run: |
          test "$MEETING_TARGET_SMOKE_REQUIRED" = "1"
          test "$MEETING_TARGET_SMOKE_DATABASE_PROVIDER" = "postgres"
          test "$MEETING_TARGET_SMOKE_DATABASE_URL" = "$DATABASE_URL"

      - name: Run backend tests
        run: python -m pytest apps/meeting-api/tests/backend -q

