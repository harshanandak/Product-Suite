name: Protected Neon production preflight

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full reviewed 40-character SHA currently at origin/main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-preflight
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: db-preflight-production
    steps:
      - name: Check out exact reviewed SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Initialize redacted failure evidence
        shell: bash
        run: |
          node --input-type=module <<'PREFLIGHT'
          import { writeFileSync } from "node:fs";
          import { createPreflightFailureEvidence } from "./scripts/migration-evidence.mjs";
          const evidence = createPreflightFailureEvidence({
            code: "PREFLIGHT_RUN_INCOMPLETE",
            repository: process.env.GITHUB_REPOSITORY,
            runId: process.env.GITHUB_RUN_ID,
            runSha: process.env.GITHUB_SHA,
          });
          writeFileSync("neon-production-preflight-evidence.json", `${JSON.stringify(evidence, null, 2)}\n`, { mode: 0o600 });
          PREFLIGHT

      - name: Prove exact current main SHA
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${INPUT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "${INPUT_SHA}"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "${INPUT_SHA}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.6

      - name: Install frozen dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate signed attestation before credential scope
        id: attestation
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          export ATTESTATION_BLOB_ID="$(git rev-parse "${INPUT_SHA}:config/neon-production-preflight-attestation.json")"
          node --input-type=module <<'PREFLIGHT'
          import Ajv from "ajv";
          import { readFileSync } from "node:fs";
          import { verifyProductionPreflightAttestation } from "./scripts/migrate-database.mjs";
          const fileBytes = readFileSync("config/neon-production-preflight-attestation.json", "utf8");
          const attestation = JSON.parse(fileBytes);
          const schema = JSON.parse(readFileSync("config/neon-production-preflight-attestation.schema.json", "utf8"));
          const trust = JSON.parse(readFileSync("config/neon-production-preflight-trust.json", "utf8"));
          if (!new Ajv({ allErrors: true }).validate(schema, attestation)) throw new Error("PREFLIGHT_ATTESTATION_SCHEMA_INVALID");
          const result = verifyProductionPreflightAttestation({
            attestation, trust, fileBytes, fileBlobId: process.env.ATTESTATION_BLOB_ID,
            runSha: process.env.INPUT_SHA, repository: process.env.GITHUB_REPOSITORY,
          });
          if (!result.ok) throw new Error(result.code);
          PREFLIGHT
          echo "blob_id=${ATTESTATION_BLOB_ID}" >> "${GITHUB_OUTPUT}"

      - name: Run fixed read-only verifier
        shell: bash
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}
          PREFLIGHT_ATTESTATION_BLOB_ID: ${{ steps.attestation.outputs.blob_id }}
        run: bun run migrate:database -- verify --environment production --history-variant original-production --expected-floor 0017

      - name: Upload redacted digest-bearing evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: neon-production-preflight-${{ inputs.sha }}
          path: neon-production-preflight-evidence.json
          if-no-files-found: warn
          retention-days: 7
